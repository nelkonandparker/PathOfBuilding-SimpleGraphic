name: Build dylib (macOS)
on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build_dylib:
    strategy:
      matrix:
        include:
          - platform: arm64
            os: macos-14
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed/
      INST_DIR: ${{ github.workspace }}/install-prefix
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install Ninja
        run: brew install ninja

      - name: run-vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "./vcpkg.json"
          runVcpkgInstall: true

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install-prefix \
            -DVCPKG_OVERLAY_TRIPLETS=$PWD/vcpkg-ports/triplets \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build -t install

      - name: Archive SimpleGraphic dylib
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGraphic-${{ matrix.triplet }}.dylib
          path: ${{ env.INST_DIR }}/lib/libSimpleGraphic.dylib

      - name: Archive dependency dylibs
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGraphic-${{ matrix.triplet }}-deps.dylib
          path: |
            ${{ env.INST_DIR }}/lib/*.dylib
            !${{ env.INST_DIR }}/lib/libSimpleGraphic.dylib

      - name: Stage runtime dylibs
        if: ${{ github.event_name == 'release' }}
        run: |
          mkdir -p stage
          cp install-prefix/lib/*.dylib stage/
          cp build/vcpkg_installed/${{ matrix.triplet }}/lib/liblibEGL_angle.dylib stage/
          cp build/vcpkg_installed/${{ matrix.triplet }}/lib/liblibGLESv2_angle.dylib stage/
          cd stage
          ln -s liblibEGL_angle.dylib    libEGL.dylib
          ln -s liblibGLESv2_angle.dylib libGLESv2.dylib
          ln -s liblcurl.dylib           lcurl.so
          ln -s liblua-utf8.dylib        lua-utf8.so
          ln -s liblzip.dylib            lzip.so
          ln -s libsocket.dylib          socket.so

      - name: Upload to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd stage
          tar -cvf ../SimpleGraphicDylibs-${{ matrix.triplet }}.tar *
          cd ..
          gh release upload ${{ github.event.release.tag_name }} \
            SimpleGraphicDylibs-${{ matrix.triplet }}.tar

      - name: Notify PathOfBuilding-PoE2-macOS repo
        if: ${{ github.event_name == 'release' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MACOS_DISPATCH_PAT }}
          repository: ${{ github.repository_owner }}/PathOfBuilding-PoE2-macOS
          event-type: update-simple-graphic-macos
          client-payload: '{"tag": "${{ github.event.release.tag_name }}", "release_link": "${{ github.event.release.html_url }}"}'
